# config/serial_driver.yaml
/**:
  ros__parameters:
    # ========================================
    # 串口配置
    # ========================================
    serial_port: "/dev/ttyACM0"
    baudrate: 115200
    
    # ========================================
    # 彈道參數
    # ========================================
    bullet_speed: 28.0        # 彈速 (m/s) - 根據實際測試調整
    gravity: 9.8              # 重力加速度 (m/s²)
    enable_ballistic: false    # 是否啟用彈道補償
    
    # ========================================
    # 調試選項
    # ========================================
    debug_mode: true         # 是否輸出詳細調試信息

